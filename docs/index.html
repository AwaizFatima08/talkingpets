<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkyPals</title>
<style>
  :root { --ink:#3a2618; --accent:#ff7a3d; --bg:#fff8ee; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f3e9df; --accent:#ff9a66; --bg:#1d1611; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; text-align:center; }
  img { max-width:100%; border-radius:18px; }
  h1 { color:var(--accent); font-size:2.4rem; margin:18px 0 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
<img src="feature-graphic.png" alt="Mimi the cat, Kiwi the parrot and Doodle the rooster">
<h1>TalkyPals</h1>
<p>Say something, and Mimi the cat, Kiwi the parrot and Doodle the rooster say it back in a funny voice! Tap their noses, tummies, wings and tails for silly sounds and faces.</p>
<p>For children under 5 · No sign-in · Voice is never saved or sent</p>
